<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cove</title>
<link rel="icon" href="/cove.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;600&family=Nunito:wght@500;700;900&family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
/* Everything is frosted glass floating over soft moving light. A theme only swaps the variables below. */
:root{--acc:#CCFF00;--on:#0a0a0a;--bg:#050605;--fg:#fff;--dim:rgba(255,255,255,.64);--o1:#7fa800;--o2:#14442a;--o3:#3d5a48;--tint:255,255,255;--ga:.17;--gb:.04;--edge:.2;--shine:.42;--shade:rgba(0,0,0,.5);--field:rgba(0,0,0,.28);
  --tile:150px;--r:26px;--spring:cubic-bezier(.34,1.56,.64,1);--font:"Roboto","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--mono:"Roboto Mono",Consolas,monospace}
[data-theme=aurora]{--acc:#b9a2ff;--bg:#090818;--o1:#5b2bb5;--o2:#1d4a9e;--o3:#7a2a5c}
[data-theme=joy]{--acc:#ff4554;--on:#fff;--bg:#0f0f13;--o1:#b3261c;--o2:#0b6f8a;--o3:#3a1420;--font:"Nunito","Segoe UI",system-ui,sans-serif}
[data-theme=midnight]{--acc:#ffd166;--bg:#050a1c;--o1:#1d4ed8;--o2:#0ea5e9;--o3:#fde68a}
[data-theme=mint]{--acc:#5eead4;--bg:#03110f;--o1:#0d9488;--o2:#22c55e;--o3:#a7f3d0}
[data-theme=sunset]{--acc:#ffb347;--bg:#160910;--o1:#b8434a;--o2:#4b238f;--o3:#8a4a2c}
[data-theme=mono]{--acc:#fff;--bg:#070707;--o1:#5a5a5a;--o2:#2a2a2a;--o3:#9a9a9a}
[data-theme=daylight],[data-theme=channel],[data-theme=pocket],[data-theme=sakura],[data-theme=paper],[data-theme=basicw]{--on:#fff;--fg:#141a2b;--dim:rgba(20,26,43,.62);--ga:.72;--gb:.42;--edge:.9;--shine:1;--shade:rgba(40,60,110,.18);--field:rgba(255,255,255,.7)}
[data-theme=daylight]{--acc:#2563eb;--bg:#dde6f6;--o1:#8ec5ff;--o2:#c4b5fd;--o3:#ffe08a}
[data-theme=channel]{--acc:#00a3e0;--bg:#eef4f8;--o1:#b8e6ff;--o2:#fff;--o3:#cdeffd;--font:"Nunito","Segoe UI",system-ui,sans-serif}
[data-theme=pocket]{--acc:#f26b1d;--bg:#f5ede2;--o1:#ffd2a6;--o2:#fff0b8;--o3:#ffc4c4;--font:"Nunito","Segoe UI",system-ui,sans-serif}
[data-theme=sakura]{--acc:#e2457f;--bg:#fbeaf1;--o1:#ffc2d9;--o2:#e9d5ff;--o3:#fff0c9;--font:"Nunito","Segoe UI",system-ui,sans-serif}
/* looks that change more than colour */
[data-theme=neon]{--acc:#ff2bd6;--on:#fff;--bg:#05010d;--o1:#ff2bd6;--o2:#00e5ff;--o3:#7a00ff;--ga:.05;--gb:.02;--shine:0;--font:"Orbitron","Segoe UI",system-ui,sans-serif}
[data-theme=neon] #orbs i{opacity:.16}
[data-theme=neon] .glass{border:1.5px solid var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 0 12px color-mix(in srgb,var(--acc) 16%,transparent)}
[data-theme=neon] .tile{border:1.5px solid #00e5ff;box-shadow:0 0 12px rgba(0,229,255,.45)}
[data-theme=neon] #hero h1{color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--acc),0 0 46px var(--acc);text-transform:uppercase;letter-spacing:.04em}
[data-theme=crt]{--acc:#7cff6b;--on:#031003;--bg:#060b06;--fg:#c9ffc2;--dim:rgba(160,255,150,.62);--tint:124,255,107;--ga:.06;--gb:.03;--edge:.45;--shine:0;--shade:rgba(0,0,0,.6);--field:rgba(0,0,0,.5);--font:"VT323",Consolas,monospace;--mono:"VT323",Consolas,monospace}
[data-theme=crt] body{--r:6px;font-size:18px;text-shadow:0 0 6px color-mix(in srgb,var(--acc) 55%,transparent)}
[data-theme=crt] body::after{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
[data-theme=crt] #orbs{display:none}
[data-theme=crt] .tile .name,[data-theme=crt] #dock button,[data-theme=crt] .btn{font-size:17px}
[data-theme=crt] #hero h1{text-transform:uppercase}
[data-theme=crt] #hero p,[data-theme=crt] .cta,[data-theme=crt] #hints,[data-theme=crt] .chip,[data-theme=crt] #count,[data-theme=crt] #clock{font-size:16px}
[data-theme=dark]{--acc:#4da3ff;--on:#04121f;--bg:#0c0d10;--ga:.05;--gb:.05;--edge:.1;--shine:0;--shade:rgba(0,0,0,.35)}
[data-theme=dark] #orbs,[data-theme^=basic] #orbs{display:none}
[data-theme=basicb]{--acc:#19d3c5;--on:#04121f;--bg:#2d2d2d;--ga:.06;--gb:.06;--edge:.12;--shine:0;--shade:rgba(0,0,0,.35)}
[data-theme=basicw]{--acc:#0ab9e6;--bg:#ebebeb;--ga:.9;--gb:.9;--edge:1;--shine:0;--shade:rgba(0,0,0,.12)}
[data-theme^=basic] #bg{opacity:.12}
[data-theme=dark] #bg{opacity:.16}
[data-theme=dark] body{--r:14px}
[data-theme=paper]{--acc:#d9480f;--bg:#f4f1ea;--ga:.96;--gb:.96;--edge:1;--shade:rgba(60,50,30,.14)}
[data-theme=paper] #orbs,[data-theme=paper] #bg{display:none}
[data-theme=paper] #hero h1,[data-theme=paper] .modal h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.02em}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--fg);background:var(--bg);overflow:hidden;user-select:none;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
#orbs,#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#orbs i{position:absolute;width:84vmax;height:84vmax;border-radius:50%;opacity:.34;will-change:transform;animation:drift 26s ease-in-out infinite alternate}   /* soft gradients, no blur filter: far cheaper to animate */
#orbs i:nth-child(1){background:radial-gradient(circle,var(--o1),transparent 62%);left:-32vmax;top:-40vmax}
#orbs i:nth-child(2){background:radial-gradient(circle,var(--o2),transparent 62%);right:-34vmax;top:-14vmax;animation-duration:34s;animation-direction:alternate-reverse}
#orbs i:nth-child(3){background:radial-gradient(circle,var(--o3),transparent 62%);left:8vw;bottom:-56vmax;opacity:.2;animation-duration:42s}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
#bg{inset:-80px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.5);opacity:.5;transition:opacity .35s;will-change:opacity}
#bg.swap{opacity:0}
#bgart,#wash{position:fixed;inset:0;z-index:-1;display:none}
.glass{background:linear-gradient(135deg,rgba(var(--tint),var(--ga)),rgba(var(--tint),var(--gb)));border:1px solid rgba(var(--tint),var(--edge));box-shadow:inset 0 1px 0 rgba(var(--tint),var(--shine)),inset 0 -1px 0 rgba(var(--tint),.06),0 14px 40px var(--shade)}
.menu,#toast{backdrop-filter:blur(30px) saturate(1.6)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}

/* top bar */
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 24px 8px;animation:rise .5s both}
.right{display:flex;gap:12px;justify-self:end;align-items:center;min-width:0}
#now{cursor:pointer;display:flex;gap:8px;align-items:center;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:700;white-space:nowrap;min-width:0;max-width:340px}
#now[hidden]{display:none}
#now b{overflow:hidden;text-overflow:ellipsis}
#now i{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);flex:none;animation:beat 1.4s ease-in-out infinite}
#now span{font-family:var(--mono);color:var(--dim)}

.left{display:flex;gap:14px;align-items:center;justify-self:start}
#me{width:40px;height:40px;border-radius:50%;border:2px solid rgba(var(--tint),.5);cursor:pointer;font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .2s var(--spring)}
#me:hover{transform:scale(1.1)}
.item .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff}
#clock{display:flex;gap:10px;align-items:center}
#stat{display:flex;gap:6px;align-items:center}
#stat:empty{display:none}
#stat .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px;box-sizing:border-box;margin-left:4px}
#stat .bat i{display:block;height:100%;background:currentColor;border-radius:1px}
/* the strip under the top bar: what you played last, and what just arrived */
#news{display:flex;gap:8px;align-items:center;padding:6px 24px 0;overflow-x:auto;scrollbar-width:none;animation:rise .5s both}
#news:empty{display:none}
#news span{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin:0 4px 0 10px}
#news span:first-child{margin-left:0}
#news button{display:flex;gap:9px;align-items:center;padding:5px 14px 5px 5px;border-radius:999px;cursor:pointer;flex:none;color:var(--fg);transition:transform .2s var(--spring),border-color .2s}
#news button:hover,#news button:focus{border-color:var(--acc);outline:none;transform:scale(1.04)}
#news i{width:32px;height:32px;border-radius:50%;background:#333 center/cover;flex:none}
#news b{font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#news small{font-size:11px;color:var(--dim);white-space:nowrap}
#brand{justify-self:start;border:0;background:none;padding:4px;cursor:pointer;color:var(--fg);opacity:.8;transition:opacity .2s,transform .2s var(--spring)}
#brand:hover{opacity:1;transform:scale(1.1)}
#brand svg{width:34px;height:34px;display:block}
@keyframes beat{50%{transform:scale(1.07)}}
#dock{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:999px;min-width:0;max-width:100%;justify-self:center}
#dock button{display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:13px;border:0;background:none;border-radius:999px;padding:9px 16px;color:var(--dim);transition:background .2s,color .2s,transform .2s var(--spring)}
#dock button:hover{color:var(--fg);background:rgba(var(--tint),.1)}
#dock button.on{background:var(--acc);color:var(--on);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent);transform:scale(1.06)}
.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{height:20px;max-width:110px;object-fit:contain;display:block}
.lg.big{height:34px;max-width:240px}
/* pop-up menus open from the button that called them */
.scrim.pop{display:block;background:none;backdrop-filter:none;animation:none}
.menu{position:fixed;min-width:320px;max-width:400px;border-radius:24px;transform-origin:bottom left;animation:menuin .16s ease-out both;user-select:none}
@keyframes menuin{from{opacity:0;transform:scale(.95) translateY(8px)}}
.menu h2{margin:0;font:600 12px var(--mono);padding:16px 24px 0;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.menu .body{padding:12px 16px 16px}

.menu .list{margin:0;gap:4px}
/* the card you see before a game starts */
.pv{display:flex;gap:24px;align-items:flex-start;padding-top:24px}
.pv .cover{width:220px;aspect-ratio:1;border-radius:var(--r);overflow:hidden;position:relative;flex:none;box-shadow:0 14px 34px var(--shade)}
.pv .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv h1{font-size:30px;font-weight:900;margin:12px 0 16px;line-height:1.05}
.chk{display:flex;gap:12px;align-items:baseline;margin:8px 0;font-size:14px}
.chk i{width:10px;height:10px;border-radius:50%;flex:none;background:#4ade80;transform:translateY(1px)}
.chk i.warn{background:#fbbf24}.chk i.bad{background:#f87171}
.chk small{display:block}
.lp{width:38px;height:26px;fill:var(--acc);flex:none}
.item.on{border-color:var(--acc);background:rgba(var(--tint),.12)}
.item small{margin-left:auto;padding-left:14px}
#q{width:210px;flex:0 1 auto;min-width:120px;outline:none;border-radius:999px;padding:10px 18px;transition:width .25s}
#q:focus{border-color:var(--acc);width:300px}
#q::placeholder{color:var(--dim)}
#clock{white-space:nowrap;flex:none;border-radius:999px;padding:10px 16px;font:600 12px var(--mono);letter-spacing:.06em}

/* stage: hero card + games */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 24px 0}
#hero{display:flex;gap:26px;align-items:center;padding:18px;border-radius:calc(var(--r) + 10px);flex:none;position:relative;overflow:hidden}
#hero.none{visibility:hidden}
#hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(var(--tint),.16) 1px,transparent 0) 0 0/18px 18px;mask:linear-gradient(100deg,transparent 30%,#000);pointer-events:none}
#hero .cover{width:clamp(110px,21vh,210px);aspect-ratio:1;border-radius:var(--r);overflow:hidden;position:relative;flex:none;box-shadow:0 14px 34px var(--shade),inset 0 0 0 1px rgba(255,255,255,.2)}
#hero .cover img,.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .35s}
#hero .info{min-width:0;position:relative}
#hero h1{font-size:clamp(24px,4.6vh,48px);font-weight:900;margin:10px 0 6px;line-height:1.04;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hero p{margin:0;color:var(--dim);font-size:14px}
#hero.in .info>*{animation:rise .26s both}
#hero.in .info>:nth-child(2){animation-delay:.05s}#hero.in .info>:nth-child(3){animation-delay:.1s}#hero.in .info>:nth-child(4){animation-delay:.15s}
.chip{display:inline-block;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:hsl(var(--h,250) 65% 42%);padding:4px 11px;border-radius:99px}
.chip.yr{background:rgba(var(--tint),.18);color:var(--fg)}
#hero .about{margin-top:8px;max-width:70ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.v-shelf #hero .about{max-width:60ch}
.cta{margin-top:14px;display:flex;gap:16px;align-items:center;font-size:13px;font-weight:700}
.gl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 11px var(--mono);margin-right:6px}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 44px var(--font);color:rgba(255,255,255,.92);text-shadow:0 2px 14px rgba(0,0,0,.35)}
main{flex:1;min-height:0;overflow:auto;padding:24px 12px 24px;scrollbar-width:thin;scrollbar-color:rgba(var(--tint),.3) transparent}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px 8px 12px;border-radius:var(--r);cursor:pointer;text-align:left;outline:none;min-width:0;
  background:linear-gradient(150deg,rgba(var(--tint),calc(var(--ga) + .03)),rgba(var(--tint),var(--gb)));border:1px solid rgba(var(--tint),var(--edge));
  box-shadow:inset 0 1px 0 rgba(var(--tint),var(--shine)),0 10px 28px var(--shade);transition:transform .3s var(--spring),opacity .25s;will-change:transform;animation:pop .45s var(--spring) both;animation-delay:calc(var(--i)*22ms)}   /* only transform and opacity ever animate */
.still .tile{animation:none}
.tile:hover{transform:translateY(-4px) scale(1.03)}
.tile:focus{transform:scale(1.08);z-index:2}
.tile:focus::after{content:"";position:absolute;inset:-7px;border-radius:calc(var(--r) + 7px);border:3px solid var(--acc);box-shadow:0 0 32px color-mix(in srgb,var(--acc) 50%,transparent);animation:cursor 1s ease-in-out infinite alternate;pointer-events:none}
@keyframes cursor{from{opacity:.55}to{opacity:1}}
.art{position:relative;aspect-ratio:1;border-radius:calc(var(--r) - 8px);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);flex:none}
.art::after,#hero .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 40%);pointer-events:none}
.art::before{content:"";position:absolute;inset:-12%;background:var(--img) center/cover;filter:blur(14px) brightness(.75)}   /* a soft copy of the cover fills the square behind it */
.fit-whole :is(.art,#hero .cover,.pv .cover,#fx .cover) img{object-fit:contain}
/* covers take the shape of the console's own boxes and fill it: tall DVD cases, wide SNES boxes, square Switch icons */
.fit-box.v-shelf .tile{flex:0 0 auto}
.fit-box.v-shelf .art{height:calc(var(--tile)*1.75);aspect-ratio:var(--ar,1);align-self:flex-start}
.fit-box.v-shelf .tile .name{width:0;min-width:100%}
.fit-box :is(#hero,.pv,#fx) .cover{aspect-ratio:var(--ar,1)}
.pvbg{aspect-ratio:3.1;border-radius:var(--r);background:center/cover;margin-top:24px}
.has>.ph{display:none}
.run{position:absolute;z-index:2;left:8px;bottom:8px;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:var(--on);padding:3px 9px;border-radius:99px}
.fav{position:absolute;z-index:1;top:5px;right:8px;color:var(--acc);font-size:17px;text-shadow:0 0 8px #000}
.new{position:absolute;z-index:3;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}   /* never played yet */
.v-list .new{display:none}
.tile.playing .art{outline:3px solid var(--acc);outline-offset:-3px}
.tile.playing{scale:1.16;margin:0 18px;z-index:1}
.v-list .tile.playing,.v-wheel .tile.playing{scale:1;margin:0}
.fold .art{background:linear-gradient(145deg,rgba(var(--tint),.16),rgba(var(--tint),.05));box-shadow:inset 0 0 0 1px rgba(var(--tint),.16);display:grid;place-items:center}
.mini{position:absolute;inset:9%;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:6%}
.mini i{border-radius:20%;background:center/cover rgba(var(--tint),.1);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.mini i:empty:not([style]){box-shadow:inset 0 0 0 1px rgba(var(--tint),.1)}
.fold .big{width:44%;height:44%;color:var(--acc);stroke-width:1.5}
.fold .name .ic{width:14px;height:14px;color:var(--acc);vertical-align:-2px;margin-right:6px}
.fold .bk{width:38%;height:38%;color:var(--acc)}
#editdone{position:fixed;left:50%;bottom:86px;translate:-50% 0;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.edit .tile{animation:wig .26s ease-in-out infinite alternate;cursor:grab}.edit .tile:nth-child(even){animation-delay:-.13s}
@keyframes wig{from{rotate:-1.1deg}to{rotate:1.1deg}}
.tile img{-webkit-user-drag:none}
.dragging{user-select:none;cursor:grabbing}
.tile.drop .art{outline:3px dashed var(--acc);outline-offset:4px}
#ghost{position:fixed;z-index:50;pointer-events:none;translate:-50% -50%;width:110px!important;height:auto!important;aspect-ratio:var(--ar,1);border-radius:16px;overflow:hidden;opacity:.92;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#ghost img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hero h1,.modal h2{font-family:var(--head,var(--font))}
.no-glow #orbs{display:none}
.btn.bad{color:#ff6b6b;border-color:rgba(255,90,90,.45)}
.foot.stack{flex-direction:column}.foot.stack .btn{width:100%}
body:not(.pad) #hints,body:not(.pad) .cta .gl{display:none}
.gl span{display:none}body:not([data-pad=ps]):not([data-pad=nin]) .gx,[data-pad=ps] .gp,[data-pad=nin] .gn{display:contents}
.gl svg{width:11px;height:11px;display:block;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.modal .body.pgin{animation:rise .22s both}
.modal:has(.tabs){height:min(88vh,860px)}.modal:has(.tabs) .body{flex:1}
details.adv{margin:14px 0}details.adv>summary{cursor:pointer;font-weight:700;padding:10px 14px;border-radius:12px;background:rgba(var(--tint),.06);list-style:none}details.adv>summary::after{content:' +';opacity:.6}details.adv[open]>summary::after{content:' -'}
details.adv>summary:focus{outline:2px solid var(--acc);outline-offset:2px}
.tile .name{font-weight:700;font-size:13px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:0 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{grid-column:1/-1;margin:14px 4px -8px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sec:first-child{margin-top:0}
#empty{text-align:center;color:var(--dim);margin:auto;line-height:1.8}

/* layout: Home (hero + two rows of icons that scroll sideways) */
.v-home main,.v-shelf main{overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;scrollbar-width:none}
.v-home #grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:var(--tile);gap:18px;margin:auto 0;padding:0 6px}
.v-home .tile .name,.v-home .tile .meta,.v-home .sec,.v-shelf .sec,.v-shelf .tile .meta{display:none}
@media (max-height:780px){.v-home #grid{grid-template-rows:auto}}
/* layout: Grid (everything, grouped by system) */
.v-grid #hero{display:none}
.v-grid #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:22px}
/* layout: Shelf (one row of big covers) */
.v-shelf #hero{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:4px 14px}
.v-shelf #hero::before,.v-shelf #hero .cover{display:none}
.v-shelf #grid{display:flex;gap:26px;padding:0 10px;align-items:center}
.v-shelf .tile{flex:0 0 calc(var(--tile)*1.75)}
.v-shelf .tile:not(:focus){opacity:.72;transform:scale(.94)}
/* layout: List (cover on the left, rows on the right) */
.v-list .stage{flex-direction:row;gap:24px;padding-bottom:8px}
.v-list main{padding:16px 12px 24px 8px}
.v-list #hero{flex:0 0 clamp(280px,26vw,380px);flex-direction:column;align-items:stretch;justify-content:flex-start;gap:16px;padding:16px 16px 24px;align-self:flex-start;margin-top:16px}
.v-list #hero .cover{width:100%}

.v-list #hero .info{padding:0 8px}
.v-list #grid{display:flex;flex-direction:column;gap:8px}
.v-list .tile{flex-direction:row;align-items:center;gap:16px;padding:8px 24px 8px 8px;border-radius:calc(var(--r)*.7)}
.v-list .tile:hover,.v-wheel .tile:hover{transform:translateX(4px)}
.v-list .tile:focus{transform:translateX(8px)}
.v-list .tile:focus::after{inset:-5px;border-radius:calc(var(--r)*.7 + 5px)}
.v-list .art{width:52px;border-radius:12px}
.v-list .tile .ph{font-size:20px}
.v-list .tile .name{flex:1;font-size:15px}
.v-list .sec{margin:16px 8px 0}

/* layout: Wheel (titles on a curved wheel, big cover beside). --d is each title's distance from the selected one. */
.v-wheel .stage{flex-direction:row-reverse;gap:24px}
.v-wheel main{flex:0 0 clamp(300px,34vw,540px);overflow-x:hidden;scrollbar-width:none;padding:38vh 24px 38vh 120px;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.v-wheel #grid{display:flex;flex-direction:column;gap:10px}
.v-wheel .tile{flex-direction:row;align-items:center;padding:12px 24px;border-radius:999px;transform-origin:left center;animation:none;
  transform:translateX(calc(var(--d,0)*var(--d,0)*-4px)) scale(calc(1 - var(--d,0)*.035));opacity:calc(1 - var(--d,0)*.11);transition:transform .35s var(--spring),opacity .3s}
.v-wheel .tile .art,.v-wheel .tile .meta,.v-wheel .sec,.v-wheel .new{display:none}
.v-wheel .tile .name{font-size:18px;font-weight:800;padding:0}
.v-wheel .tile:focus{transform:translateX(16px) scale(1.12);opacity:1;background:var(--acc);color:var(--on);border-color:var(--acc)}
.v-wheel .tile:focus::after{display:none}
.v-wheel #hero{flex:1;flex-direction:column;justify-content:center;align-items:flex-start;gap:24px;padding:32px;margin:16px 0}
.v-wheel #hero .cover{width:min(44vh,440px)}
.v-wheel #hero h1{white-space:normal}

/* bottom bar */
footer{display:flex;align-items:center;gap:16px;padding:8px 24px 16px;animation:rise .5s .1s both}
#quick{display:flex;gap:10px}
#quick button{position:relative;width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .2s var(--spring),border-color .2s}

#quick svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#quick button::after{content:attr(title);position:absolute;bottom:54px;left:50%;transform:translateX(-50%) translateY(6px);white-space:nowrap;font-size:12px;font-weight:700;background:#111;color:#fff;border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#quick button:hover::after,#quick button:focus::after{opacity:1;transform:translateX(-50%)}
#ver{color:var(--dim);font:500 12px var(--mono);letter-spacing:.04em;opacity:.7;cursor:pointer}
#count{color:var(--dim);font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase}
#hints{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;display:flex;gap:14px;align-items:center}

/* start-up and launch moments */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
#splash div{font:900 46px var(--font);letter-spacing:.2em;display:flex;gap:18px;align-items:center;animation:pop .7s var(--spring) both}
#splash div{flex-direction:column;gap:26px}
#splash img{width:132px;height:132px;border-radius:34px;box-shadow:0 20px 60px var(--shade);animation:beat 1.2s ease-in-out infinite}
#fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(30px);animation:fade .25s;transition:opacity .45s;color:#fff;text-align:center}

#fx .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* the game's own disc or cartridge, drawn to its real proportions, with the cover as its label */
#fx .media{width:fit-content;margin:auto;filter:drop-shadow(0 26px 40px rgba(0,0,0,.6));animation:pop .6s var(--spring) both}
#fx .disc{width:calc(min(38vh,340px)*var(--d));aspect-ratio:1;border-radius:50%;position:relative;background:var(--img) center/cover,#1c1c20;
  -webkit-mask:radial-gradient(circle closest-side,transparent 12.2%,#000 12.8%);mask:radial-gradient(circle closest-side,transparent 12.2%,#000 12.8%);animation:spin 2.1s .25s cubic-bezier(.3,0,.15,1) both}
#fx .disc i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle closest-side,transparent 12.5%,rgba(226,228,234,.9) 13% 28%,rgba(0,0,0,.25) 28.5% 29.5%,transparent 30%),
  conic-gradient(from 30deg,transparent,rgba(255,255,255,.28) 9%,transparent 20%,transparent 50%,rgba(255,255,255,.2) 59%,transparent 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#fx .cart{width:var(--w);aspect-ratio:var(--r);position:relative;border-radius:var(--rad);background:linear-gradient(165deg,color-mix(in srgb,var(--col),#fff 14%),var(--col) 45%,color-mix(in srgb,var(--col),#000 30%));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -8px 14px rgba(0,0,0,.25);animation:slot .9s .1s var(--spring) both}
#fx .cart b{position:absolute;background:center/cover;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 0 18px rgba(0,0,0,.18)}
#fx .real{display:block;height:min(38vh,340px);animation:slot .9s .1s var(--spring) both}
#fx .real.rot{animation:spin 2.1s .25s cubic-bezier(.3,0,.15,1) both}
@keyframes spin{to{transform:rotate(720deg)}}
@keyframes slot{from{transform:translateY(-70px)}55%{transform:translateY(10px)}}
#gacha{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(26px);display:grid;place-content:center;text-align:center;animation:fade .25s}
#gacha .reel{width:100vw;overflow:hidden;position:relative;padding:26px 0}

#gacha .cover{height:min(30vh,260px);aspect-ratio:var(--ar,1);border-radius:var(--r);overflow:hidden;position:relative;flex:none;transition:scale .3s,box-shadow .3s}
#gacha .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gacha .reel>i{position:absolute;left:50%;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--acc);transform:translateX(-50%);box-shadow:0 0 14px var(--acc)}
#gacha .win{scale:1.12;box-shadow:0 0 0 4px var(--acc),0 0 70px var(--acc);z-index:1}
#gacha h2{font-size:30px;font-weight:900;margin:18px 0 0}
#fx h2{font-size:30px;font-weight:900;margin:26px 0 4px;animation:rise .4s .15s both}
#fx p{margin:0;opacity:.75;animation:rise .4s .22s both}
#fx .bar{width:220px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:22px auto 0;overflow:hidden}
#fx .bar i{display:block;height:100%;background:var(--acc);animation:fill 1.5s ease-out both}
@keyframes fill{from{width:0}to{width:100%}}

/* style: Full art. The selected game's cover fills the screen, sharp, under a dark wash; panels turn solid. */
.s-art #orbs{display:none}
.s-art #bg{filter:blur(46px) saturate(1.4);opacity:.6}
.s-art #bg.swap{opacity:0}
.s-art #bgart{display:block;background:no-repeat right top/auto 70%;transition:opacity .35s;mask-image:linear-gradient(90deg,transparent 56%,#000 80%),linear-gradient(0deg,transparent,#000 38%);mask-composite:intersect}
.s-art #bgart.wide{background-size:cover;background-position:center;mask-image:none}
.s-art #bgart.swap{opacity:0}
.s-art #bgart:not(.wide){display:none}
.s-art #wash{display:block;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 86%,transparent),color-mix(in srgb,var(--bg) 42%,transparent) 58%,color-mix(in srgb,var(--bg) 14%,transparent)),linear-gradient(0deg,color-mix(in srgb,var(--bg) 95%,transparent) 16%,transparent 64%)}   /* keeps text and the cover row readable over any art */
.s-art .glass,.s-flat .glass{background:color-mix(in srgb,var(--bg) 74%,transparent);box-shadow:0 10px 30px var(--shade)}
.s-art .tile,.s-flat .tile{padding:0 0 10px;gap:8px;background:none;border-color:transparent;box-shadow:none}
.s-art .art,.s-flat .art{border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.s-art .art::after,.s-flat .art::after,.s-art #hero .cover::after,.s-flat #hero .cover::after,.s-art #hero::before,.s-flat #hero::before{display:none}
.s-art #hero,.s-art.v-list #hero{background:none;border-color:transparent;box-shadow:none}
.s-art #hero .cover{display:none}
.s-art.v-list #hero .cover{display:block}
.s-art #hero h1{text-shadow:0 2px 20px var(--bg)}
.s-art .v-list .tile,.s-art.v-list .tile,.s-flat.v-list .tile{padding:8px 24px 8px 8px;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.s-art.v-list .art,.s-flat.v-list .art{border-radius:12px;box-shadow:none}
/* style: Flat. Solid theme colour, no glow, no blur. */
.s-flat #orbs,.s-flat #bg{display:none}
.s-flat .glass{background:rgba(var(--tint),.08);box-shadow:none}
.s-flat .modal,.s-flat .menu{background:color-mix(in srgb,var(--bg) 92%,var(--fg))}

/* Android: hide what only exists on Windows */
.android [data-set=after],.android [data-act=esde],.android [data-act=win],.android [data-act=lnk],.android [data-act=show],.android [data-act=del],.android [data-act=mods],.android [data-act=applnk],.android [data-act=site],.android [data-act=open],.android [data-act=upd],.android [data-act=addemu],.android [data-act=inbox],.android [data-act=orgother],.android #padhint{display:none}

/* motion settings */
.m-calm #orbs i,.m-calm .tile:focus::after{animation:none}
.m-off *,.m-off *::before,.m-off *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#orbs i,.tile,.tile:focus::after,#brand img,#now i{animation:none}}

/* panels */
.btn{background:linear-gradient(135deg,rgba(var(--tint),calc(var(--ga) + .04)),rgba(var(--tint),var(--gb)));border:1px solid rgba(var(--tint),var(--edge));box-shadow:inset 0 1px 0 rgba(var(--tint),var(--shine));border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;transition:border-color .15s,transform .2s var(--spring)}
.btn:hover,.btn:focus-visible{border-color:var(--acc);outline:none;transform:scale(1.04)}
.btn:active{transform:scale(.96)}
.btn.pri,.tabs .btn.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 40%,transparent)}
.btn.xl{font-size:17px;padding:14px 26px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:10;animation:fade .2s}
.modal{width:min(900px,94vw);max-height:88vh;display:flex;flex-direction:column;border-radius:32px;user-select:text;backdrop-filter:blur(44px) saturate(1.8);animation:pop .35s var(--spring) both}
.modal h2{margin:0;padding:24px 28px 6px;font-size:24px;font-weight:900;letter-spacing:.01em}
.modal h3{margin:22px 0 4px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);opacity:.8}
.modal .body{padding:10px 28px 24px;overflow:auto;overscroll-behavior:contain;line-height:1.55;scrollbar-width:thin;scrollbar-color:rgba(var(--tint),.3) transparent}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 28px;border-top:1px solid rgba(var(--tint),.14);flex-wrap:wrap}
.tabs{display:flex;gap:6px;padding:10px 28px 4px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;margin:9px 0;flex-wrap:wrap}
.row label{min-width:120px;color:var(--dim);font-size:13px}
.row label.sm{min-width:0;display:inline-flex;align-items:center;gap:6px;margin-right:8px;font-size:12px}
.card{border:1px solid rgba(var(--tint),.16);border-radius:20px;padding:14px 16px;margin:12px 0;background:rgba(var(--tint),.06);box-shadow:inset 0 1px 0 rgba(var(--tint),.18)}
input[type=text],select{background:var(--field);border:1px solid rgba(var(--tint),.18);border-radius:12px;padding:8px 12px;min-width:0;outline:none}
select option{background:#16181d;color:#fff}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}
input.w{flex:1}
small,.dim{color:var(--dim);font-size:12.5px}
code{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--dim)}
.list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.item{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(var(--tint),.05);border:1px solid transparent;border-radius:12px;padding:9px 12px;cursor:pointer}
.item:hover{background:rgba(var(--tint),.12)}
#dd{z-index:20}
#dd .menu{position:static;max-height:70vh;overflow:auto;animation:none}
#dd .item{width:100%}
#dd .item:focus{outline:2px solid var(--acc);outline-offset:2px}
.item i{width:14px;height:11px;border-radius:3px;background:var(--acc);flex:none}
.sws{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 8px;margin:6px 0 4px}
.modal .sws{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.menu h4,.modal h4{margin:10px 0 0;font-size:11px;font-weight:600;color:var(--dim)}
.menu h4:first-child{margin-top:0}
.sw{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--dim);min-width:0}

.sw i{display:block;width:100%;aspect-ratio:16/10;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(var(--tint),.22);transition:transform .2s var(--spring);
  background:linear-gradient(var(--a),var(--a)) 16% 24%/30% 8% no-repeat,linear-gradient(var(--a),var(--a)) 12% 72%/24% 38% no-repeat,linear-gradient(rgba(128,128,128,.5),rgba(128,128,128,.5)) 50% 72%/24% 38% no-repeat,linear-gradient(rgba(128,128,128,.5),rgba(128,128,128,.5)) 88% 72%/24% 38% no-repeat,var(--b)}
.sw span{font-size:10px;font-weight:600;line-height:1.15;text-align:center}
.sw:hover i{transform:scale(1.06)}
.sw.on{color:var(--fg)}
.sw.on i{outline:2px solid var(--acc);outline-offset:2px}
#layer .sw:focus{outline:none}
#layer .sw:focus i{outline:2px solid var(--acc);outline-offset:2px;transform:scale(1.08)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(var(--tint),.07)}
.seg button{flex:1;border:0;background:none;color:var(--dim);font-weight:700;font-size:12px;padding:9px 6px;border-radius:10px;cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--acc);color:var(--on)}
#layer :is(button,select,input):focus{outline:2px solid var(--acc);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);z-index:70;opacity:0;transition:opacity .2s,transform .3s var(--spring);pointer-events:none;border-radius:999px;padding:10px 20px;font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%)}
/* clean pass: squared-off corners instead of pills, and boxes only where they hold something */
:root{--rb:10px}
#dock,#q,#clock,#now{background:none;border:0;box-shadow:none;backdrop-filter:none}
#dock button,#q,#now,#toast,.btn,.run,#news button,#hints .gl.w,.v-wheel .tile,input[type=text],select{border-radius:var(--rb)}
.chip{border-radius:6px}
#q{background:rgba(var(--tint),.07)}#q:focus{background:rgba(var(--tint),.12)}
.btn{background:rgba(var(--tint),.07);border:1px solid transparent;box-shadow:none}
.btn:hover,.btn:focus-visible{background:rgba(var(--tint),.14);border-color:transparent;transform:none}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri,.tabs .btn.on{box-shadow:none}.btn.pri:hover{background:var(--acc)}
.tabs .btn:not(.on){background:none}
.btn.bad{background:none}
#quick button{background:none;border:0;box-shadow:none;border-radius:var(--rb)}
#quick button:hover,#quick button:focus{background:rgba(var(--tint),.1)}
input[type=text],select{border-color:transparent}
.modal{border-radius:22px}.modal .foot{border-top:0}
span.dot.big{width:56px;height:56px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:900;font-size:22px;color:#fff;margin-right:8px}
.card{border:0;box-shadow:none;border-radius:14px;background:rgba(var(--tint),.04)}
#news button{background:none;border:0;box-shadow:none;backdrop-filter:none}#news button:hover,#news button:focus{background:rgba(var(--tint),.08)}
.v-list #hero .cover{width:auto;max-width:100%;height:min(46vh,420px);align-self:center}

async function getRA(){   // downloads RetroArch into Cove's own folder on this PC (or finds the copy already there) and registers it
  const r=await api('core',{kind:'app'}); let e=S.emus.find(x=>x.exe.toLowerCase()===r.exe.toLowerCase());
  if(!e){e={id:uid(),kind:'retroarch',name:'RetroArch',exe:r.exe,args:''};S.emus.push(e)}
  emuSys(e).forEach(s=>{if(!S.defaults[s])S.defaults[s]=e.id});save();return e;
}
function offerRA(g){
  modal('No emulator for '+esc(sysOf(g.sys).name),`<p>Cove can set up RetroArch with the <b>${esc(coreFor(g.sys))}</b> core and start the game with it. RetroArch is a free download of about 200 MB from libretro, kept in Cove's own folder on this PC.</p>`,
    `<button class="btn" data-act="x">Back</button><button class="btn" data-act="own">Choose my own</button><button class="btn pri xl" data-act="get">Set it up</button>`);
  onChange=()=>{};
  onAct=async a=>{
    closeModal(); if(a==='own')return settings('emus'); if(a!=='get')return;
    toast('Downloading RetroArch. This takes a few minutes.');
    try{await getRA();launch(g)}catch(e){toast(e.message)}
  };
}

  b.forEach((x,i)=>{x.textContent=have[i]?'Remove':'Get';x.dataset.have=have[i]?1:'';x.previousElementSibling.textContent=have[i]?'Downloaded':'Not downloaded'});

const PER=['fav','last','time'], me=()=>S.users.find(u=>u.id===S.user)||S.users[0];
// ponytail: the current player's numbers live on the game itself and the others wait in game.p; switching swaps them. Fine for one PC, change to per-player lookups if players ever sync between machines.
function setUser(id){
  if(NOW)return toast('Close the game first');
  for(const k in S.games){const o=S.games[k], p=o.p||(o.p={}), mine={};
    PER.forEach(f=>{if(o[f]!==undefined){mine[f]=o[f];delete o[f]}});
    Object.assign(o,p[id]); delete p[id];
    if(Object.keys(mine).length)p[S.user]=mine;
    if(!Object.keys(p).length)delete o.p;
  }
  S.user=id;save();userUI();render();
}
const tally=u=>{let f=0,s=0;for(const k in S.games){const o=u.id===S.user?S.games[k]:S.games[k].p?.[u.id]||{};if(o.fav)f++;s+=o.time||0}return (f?f+(f===1?' favourite':' favourites')+' · ':'')+(played(s)||'no play time yet')};
const avatar=u=>u.pic?`background:center/cover url('/file?t=${T}&p=${encodeURIComponent(u.pic)}')`:`background:${u.col}`, initial=u=>u.pic?'':esc((u.name.trim()[0]||'?').toUpperCase());

function users(){
  const b=$('#me').getBoundingClientRect();
  $('#layer').innerHTML=`<div class="scrim pop"><div class="glass menu" style="left:${b.left}px;top:${b.bottom+10}px;transform-origin:top left"><h2>Players</h2><div class="body list">${
    S.users.map(u=>`<button class="item ${u.id===S.user?'on':''}" data-act="u" data-arg="${u.id}"><span class="dot" style="${avatar(u)}">${initial(u)}</span><b>${esc(u.name)}</b><small>${tally(u)}</small></button>`).join('')}
    <button class="item" data-act="add"><svg class="ic" viewBox="0 0 24 24">${ICON.add}</svg><b>Add a player</b></button><button class="item" data-act="edit"><svg class="ic" viewBox="0 0 24 24">${ICON.user}</svg><b>Change ${esc(me().name)}</b></button></div></div></div>`;
  ($('#layer .on')||focusables()[0])?.focus(); onChange=()=>{}; blip('tab');
  onAct=(a,arg)=>{
    if(a==='u'){$('#layer').innerHTML='';if(arg!==S.user)setUser(arg);else render(true);return blip('ok')}
    if(a==='add'){if(NOW)return toast('Close the game first');const u={id:uid(),name:'Player '+(S.users.length+1),col:`hsl(${Math.floor(Math.random()*360)} 70% 50%)`};S.users.push(u);$('#layer').innerHTML='';setUser(u.id)}
    userEdit(me());
  };
}
function userEdit(u){
  const hex=/^#/.test(u.col)?u.col:'#19d3c5';
  modal('Player',`<div class="row"><label>Name</label><input class="w" type="text" data-set="name" value="${esc(u.name)}"></div>
    <div class="row"><label>Picture</label><span class="dot big" style="${avatar(u)}">${initial(u)}</span><button class="btn" data-act="pic">Choose image</button>${u.pic?'<button class="btn" data-act="nopic">Remove</button>':''}</div>
    <div class="row"><label>Colour</label><input type="color" data-set="col" value="${hex}"><small>Shown when there is no picture</small></div>
    <small>Favourites, play time and the Recent list are kept separately for each player. Games, artwork and settings are shared.</small>`,
    `${S.users.length>1?'<button class="btn bad" data-act="del">Remove player</button>':''}<button class="btn pri" data-act="x">Done</button>`);
  $('#layer input').focus(); $('#layer input').select();
  onChange=(k,v)=>{u[k]=v.trim()||u[k];save();userUI()};

let padPrev={},padT=0,padRep=0;
addEventListener('gamepadconnected',e=>toast('Controller connected: '+e.gamepad.id.replace(/\s*\(.*$/,'')));
(function pad(){
  if(window.CoveNative)return;   // the Android app sends buttons itself
  // every connected pad counts (a wheel, a stream deck or a virtual pad can sit in slot 0 and hide the real one)
  const pads=[...navigator.getGamepads()].filter(p=>p&&p.connected);
  if(pads.length&&document.hasFocus()){
    const now=performance.now(), st={};
    for(const p of pads){
      const b=i=>p.buttons[i]?.pressed, ax=p.axes, std=p.mapping==='standard';
      // pads the browser cannot map report the d-pad as a "hat" on the last axis: 8 directions from -1 (up) clockwise to 1
      const hat=!std&&ax.length>=10?Math.round((ax[9]+1)*3.5):-1, H=(...v)=>v.includes(hat);
      const big=Math.abs(ax[0])>=Math.abs(ax[1]), sx=big?ax[0]:0, sy=big?0:ax[1];   // a stick pushed diagonally means its stronger direction
      const cur={l:(std&&b(14))||sx<-.5||H(5,6,7),r:(std&&b(15))||sx>.5||H(1,2,3),u:(std&&b(12))||sy<-.5||H(7,0,1),d:(std&&b(13))||sy>.5||H(3,4,5),
        a:b(std?0:1),bk:b(std?1:2),x:b(std?2:0),y:b(3),lb:b(4),rb:b(5),lt:std&&b(6),rt:std&&b(7),sel:b(8),start:b(9)};
      for(const k in cur)st[k]=st[k]||cur[k];
    }
    const hit=k=>st[k]&&(!padPrev[k]||('lrud'.includes(k)&&now-padT>(padRep?110:380)));   // hold: a pause, then steady steps
    if(!'lrud'.split('').some(k=>st[k]))padRep=0;
    for(const k in st)if(hit(k)){if('lrud'.includes(k)){padRep=padPrev[k]?1:0;padT=now}navKey(k)}
    padPrev=st;
  }
  requestAnimationFrame(pad);
})();
// menu sounds: small synth voices, played dry. No audio files.
let actx,bus;
function audio(){
  if(!actx){
    actx=new AudioContext(); bus=actx.createGain();
    const warm=actx.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=2600;   // takes the harsh edge off
    bus.connect(warm); warm.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume();
  bus.gain.value=(S.ui.vol??70)/100;
}
// [name, wave, pitch, length, loudness]. Soft is the original set.
const PACKS=[['soft','Soft','sine',1,1,1],['click','Click','triangle',2,.35,1.3],['chip','Chip','square',1,.5,.35],['glass','Glass','sine',2,1.6,.8],['deep','Deep','triangle',.5,1.2,1.4]];
function note(f,at=0,gain=.1,dur=.22){
  const pk=PACKS.find(x=>x[0]===S.ui.pack)||PACKS[0]; f*=pk[3]; dur*=pk[4]; gain*=pk[5];
  const osc=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+at+.01;
  osc.type=pk[2]; osc.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.03); g.gain.setTargetAtTime(0,t+.03,dur/4);   // eased in and eased out, so nothing starts or stops abruptly
  osc.connect(g).connect(bus); osc.start(t); osc.stop(t+dur*2+.1);
}
// soft bells: every sound uses notes of one scale (C D E G A, around the middle of a piano's upper half), so nothing clashes
const [C,D,E,G,A,C2]=[523,587,659,784,880,1047];
const SFX={
  move:()=>note(E,0,.05,.12),
  tab:()=>note(G,0,.06,.16),
  ok:()=>{note(E,0,.07,.2);note(A,.07,.07,.3)},
  back:()=>{note(G,0,.06,.16);note(D,.07,.06,.24)},
  open:()=>{note(C,0,.06,.3);note(G,.05,.05,.36)},
  error:()=>{note(D,0,.07,.2);note(C,.12,.07,.3)},
  launch:()=>[C,E,G,C2].forEach((f,i)=>note(f,i*.11,.08,.8)),
  boot:()=>[C,G,C2].forEach((f,i)=>note(f,i*.14,.06,.9)),
};

/* built-in file browser: works with a controller, unlike the Windows dialogs */
function pick(kind){return new Promise(res=>{
  const exts=kind==='exe'?['.exe']:kind==='zip'?['.zip']:kind==='image'?['.png','.jpg','.jpeg','.webp','.gif']:[];
  const prev={html:$('#layer').innerHTML,onAct,onChange};
  const done=v=>{escHook=null;$('#layer').innerHTML=prev.html;onAct=prev.onAct;onChange=prev.onChange;res(v)};
  const join=(a,b)=>a?a.replace(/[\\/]+$/,'')+INFO.sep+b:b;
  const show=async p=>{
    let r; try{r=await api('browse',{path:p,exts})}catch(e){
      if(p)return show('');                                                  // folder vanished: start from the drives
      try{return done((await api('pick',{kind})).path)}catch{return done('')}  // older helper: fall back to the Windows dialog
    }
    modal(kind==='folder'?'Choose a folder':'Choose a file',`<code>${esc(r.path||'This PC')}</code><div class="list">
      ${r.path?`<button class="item" data-act="go" data-arg="${esc(r.parent)}">&larr; Up one level</button>`:''}
      ${r.dirs.map(d=>`<button class="item" data-act="go" data-arg="${esc(join(r.path,d))}"><i></i>${esc(d)}</button>`).join('')}
      ${r.files.map(f=>`<button class="item" data-act="file" data-arg="${esc(join(r.path,f))}">${esc(f)}</button>`).join('')}</div>`,
      `<button class="btn" data-act="win" style="margin-right:auto">Browse with Windows</button><button class="btn" data-act="cancel">Cancel</button>${kind==='folder'&&r.path?'<button class="btn pri" data-act="use">Use this folder</button>':''}`);
    (document.querySelectorAll('#layer .item')[r.path?1:0]||$('#layer .item'))?.focus();
    escHook=()=>done('');
    onChange=()=>{};
    onAct=async(a,arg)=>{
      if(a==='win'){toast('The Windows dialog is open (it may be behind this window)');let p='';try{p=(await api('pick',{kind})).path}catch{};if(p){S.lastDir=kind==='folder'?p:dir(p);save();done(p)}return}
      if(a==='go')show(arg);else if(a==='file'){S.lastDir=r.path;save();done(arg)}else if(a==='use'){S.lastDir=r.path;save();done(r.path)}else done('')};
  };
  show(S.lastDir||'');
})}

    `${g.store?'':'<button class="btn bad" data-act="del">Delete</button>'}<button class="btn" data-act="hide">Hide</button>${g.store?'':'<button class="btn" data-act="show">Show file</button>'}${r&&r.exe&&!INFO.android?'<button class="btn" data-act="emu">Open emulator</button>':''}<button class="btn" data-act="art">Set artwork</button><button class="btn" data-act="match">Fix match</button>${r&&MODDIR[S.emus.find(e=>e.exe===r.exe)?.kind]?'<button class="btn" data-act="mods">Mods</button>':''}<button class="btn" data-act="lnk">Desktop shortcut</button><button class="btn" data-act="fav">${o.fav?'Unfavourite':'Favourite'}</button><button class="btn pri" data-act="play">Launch</button>`);

    if(a==='hide')return hide();

          `<button class="btn" data-act="none">No match, clear it</button><button class="btn pri" data-act="back">Back</button>`);

          if(b==='use'){delete o.art;const old=S.meta[artKey(g)]||{},h=res[arg];applyMatch(g,{...h,about:h.about||old.d||'',year:h.year||old.y||'',force:true});toast('Matched to '+h.title)}
          if(b==='none'){S.meta[artKey(g)]=0;S.art[artKey(g)]=0;save()}
          details(g);
        };
      };
      return draw(lookFor(g),sources()[0]||'wiki');
    }
    if(a==='lnk'){if(!r)return toast('Set up an emulator first');await api('shortcut',{name:g.title,exe:r.exe,args:r.args,cwd:r.cwd});toast('Shortcut added to your desktop')}
    if(a==='del'){

        if(b==='hide')return hide();
        if(b!=='yes')return details(g);
        await api('trash',{path:target});delete S.games[g.id];save();await scan();closeModal();toast('Moved to the Recycle Bin');
      };
    }
  };
}

/* mods: installs into the folder the emulator loads mods from for this game (Switch emulators so far) */
const MODDIR={yuzu:['load'],ryujinx:['mods','contents']};
async function titleId(g){
  const o=gs(g.id); if(o.tid)return o.tid;
  const m=/\[([0-9A-Fa-f]{16})\]/.exec(g.path); if(m)return m[1].toUpperCase();
  if(g.folder)try{return (await api('npdm',{path:J(g.folder,'exefs','main.npdm')})).tid}catch{}
  return '';
}
async function mods(g){
  const r=resolve(g), emu=r&&S.emus.find(e=>e.exe===r.exe), base=emu&&MODDIR[emu.kind];
  if(!base)return toast('Mods are supported for Switch and Switch 2 emulators so far');
  const data=await dataDir(emu); if(!data)return toast('Open '+emu.name+' once first, so its data folder exists');
  const tid=await titleId(g), dirOn=tid&&J(data,...base,tid), dirOff=tid&&J(data,'mods_off',tid);
  let on=[],off=[];
  if(tid){try{on=(await api('browse',{path:dirOn,exts:[]})).dirs}catch{} try{off=(await api('browse',{path:dirOff,exts:[]})).dirs}catch{}}
  modal('Mods for '+esc(g.title),tid?`
      <small>Installed for ${esc(emu.name)}, title ID ${esc(tid)}. A mod is a folder with <code>romfs</code>, <code>exefs</code> or <code>cheats</code> inside it.</small>
      <div class="list">${on.map(m=>`<div class="row"><b style="flex:1">${esc(m)}</b><small>On</small><button class="btn" data-act="off" data-arg="${esc(m)}">Turn off</button></div>`).join('')}
      ${off.map(m=>`<div class="row"><b style="flex:1;opacity:.55">${esc(m)}</b><small>Off</small><button class="btn" data-act="on" data-arg="${esc(m)}">Turn on</button></div>`).join('')}
      ${on.length+off.length?'':'<small>No mods installed for this game yet.</small>'}</div>
      <code>${esc(dirOn)}</code>`
    :`<p>Cove could not read this game's title ID, which names its mod folder. Type it once and Cove remembers it. Your emulator shows it in the game's properties.</p>
      <div class="row"><label>Title ID</label><input class="w" type="text" data-set="tid" placeholder="16 characters, for example 0100F2C0115B6000"></div>`,
    `<button class="btn" data-act="back">Back</button>${tid?'<button class="btn" data-act="openm">Open mods folder</button><button class="btn" data-act="addf">Install from a folder</button><button class="btn pri" data-act="addz">Install from a zip</button>':''}`);
  onChange=(k,v)=>{if(/^[0-9a-f]{16}$/i.test(v.trim())){gs(g.id).tid=v.trim().toUpperCase();save();mods(g)}else toast('A title ID is 16 characters, 0-9 and A-F')};
  onAct=async(a,arg)=>{
    if(a==='back')return details(g);
    if(a==='openm'){await api('mkdir',{paths:[dirOn]});return api('open',{path:dirOn})}
    if(a==='addf'){const p=await pick('folder');if(!p)return;const x=await api('copy',{from:p,to:J(dirOn,file(p))});toast(`Installed ${file(p)} (${x.files} files)`);return mods(g)}
    if(a==='addz'){const p=await pick('zip');if(!p)return;const x=await api('modzip',{zip:p,dest:dirOn});toast(`Installed ${x.name} (${x.files} files)`);return mods(g)}
    if(a==='off'||a==='on'){const [f,t]=a==='off'?[dirOn,dirOff]:[dirOff,dirOn];await api('move',{moves:[{from:J(f,arg),to:J(t,arg)}]});return mods(g)}
  };
}

/* organizer: sorts a folder of loose files into ROMs\<system> */
async function organize(src){
  const r=await api('ls',{path:src,depth:4}), sys=systems(), plan=[], unknown=[];
  for(const i of r.items){
    const e=ext(i.p); if(SIDECAR.test(i.p))continue;
    const cands=sys.filter(s=>s.exts.includes(e)), sure=sys.filter(s=>s.auto.includes(e));
    if(!cands.length){unknown.push(i.p);continue}
    plan.push({p:i.p,e,cands,sys:sure.length===1?sure[0].id:''});
  }
  const names=new Set(r.items.map(i=>i.p)), amb=[...new Set(plan.filter(f=>!f.sys).map(f=>f.e))];
  const run=async()=>{
    const moves=[];
    for(const f of plan)if(!f.sys&&f.e==='.bin'){const c=plan.find(x=>x.sys&&dir(x.p)===dir(f.p)&&/\.(cue|gdi)$/.test(x.e));if(c)f.sys=c.sys}   // disc data follows its .cue
    for(const f of plan){
      if(!f.sys)continue;
      const to=J(S.library,'ROMs',f.sys);
      moves.push({from:J(r.root,f.p),to:J(to,file(f.p))});
      for(const n of names)if(SIDECAR.test(n)&&dir(n)===dir(f.p)&&stem(n)===stem(f.p))moves.push({from:J(r.root,n),to:J(to,file(n))});
    }
    const res=await api('move',{moves});
    await scan();closeModal();
    toast(`Moved ${res.moved} file${res.moved===1?'':'s'}`+(res.skipped?`, skipped ${res.skipped} already in the library`:''));
  };
  if(!plan.length){toast(unknown.length?`Nothing recognised in that folder (${unknown.length} unknown files left alone)`:'That folder is empty');return}
  const draw=()=>{
    modal('Organize games',`
      <p><b>${plan.filter(f=>f.sys).length}</b> of ${plan.length} files have a home. Files move into <code>${esc(J(S.library,'ROMs'))}</code>; save files with the same name go with them. Nothing is overwritten or deleted.${unknown.length?` ${unknown.length} unrecognised files stay where they are.`:''}</p>
      ${amb.length?'<div class="card"><b>These file types are used by several systems.</b> Set a whole type at once here, or fix single files below.'+amb.map(e=>`<div class="row"><label>all ${esc(e)} files</label><select data-set="bulk" data-arg="${esc(e)}">${opt('','choose...','')}${sys.filter(s=>s.exts.includes(e)).map(s=>opt(s.id,s.name,'')).join('')}</select></div>`).join('')+'</div>':''}
      ${plan.map((f,n)=>`<div class="row"><select data-set="one" data-arg="${n}">${opt('','leave it','')}${f.cands.map(s=>opt(s.id,s.name,f.sys)).join('')}</select><small>${esc(f.p)}</small></div>`).join('')}`,
      `<button class="btn" data-act="x">Cancel</button><button class="btn pri" data-act="go">Move files</button>`);
  };
  onChange=(k,v,arg)=>{if(k==='bulk')plan.forEach(f=>{if(f.e===arg)f.sys=v});else plan[arg].sys=v;draw()};
  onAct=a=>a==='go'?run():closeModal();
  draw();
}

/* emulators */
async function findEmus(folder){
  if(INFO.android){
    const all=AKINDS.flatMap(k=>k.comps.map(c=>({k,c}))), on=(await api('apps',{comps:all.map(x=>x.c)})).r; let n=0;
    all.forEach((x,i)=>{if(on[i]&&!S.emus.some(e=>e.exe===x.c)){S.emus.push({id:uid(),kind:x.k.id,name:x.k.comps.length>1&&x.k.id==='eden'?x.c.split('.')[1][0].toUpperCase()+x.c.split('.')[1].slice(1):x.k.name,exe:x.c});n++}});
    S.emus.forEach(e=>emuSys(e).forEach(s=>{if(!S.defaults[s])S.defaults[s]=e.id}));
    save();return n;
  }
  const r=await api('ls',{path:folder,depth:4,exts:['.exe']}), byDir={}, have=new Set(S.emus.map(e=>e.exe.toLowerCase()));
  r.items.forEach(i=>{if(!/update-old|backup/i.test(i.p))(byDir[dir(i.p)]=byDir[dir(i.p)]||[]).push(i)});
  let n=0;
  for(const d in byDir){
    const exes=byDir[d]; let k, main;
    for(const x of exes){const kk=KINDS.find(k=>k.rx.test(file(x.p).toLowerCase()));if(kk&&!(NOT_MAIN.test(file(x.p))&&kk.id!=='yuzu')){k=kk;main=x;break}}
    if(!k&&exes.some(x=>/(-(cli|cmd)\.exe$|nx2)/i.test(file(x.p)))){   // unknown Eden-style fork: biggest real exe wins
      main=exes.filter(x=>!NOT_MAIN.test(file(x.p))).sort((a,b)=>b.s-a.s)[0]; k=main&&KINDS[0];
    }
    if(!k)continue;
    const exe=J(r.root,main.p); if(have.has(exe.toLowerCase()))continue;
    const folderName=file(dir(exe));
    S.emus.push({id:uid(),kind:k.id,name:k.id==='yuzu'||k.id==='ryujinx'?folderName:k.name.split(' /')[0],exe});
    n++;
  }
  S.emus.forEach(e=>emuSys(e).forEach(s=>{if(!S.defaults[s])S.defaults[s]=e.id}));
  save();return n;
}
async function dataDir(e){
  if(e.data)return e.data;
  const k=kindOf(e); if(!k.data)return '';
  const v={emudir:dir(e.exe),exe:stem(e.exe),APPDATA:INFO.appdata,DOCS:INFO.docs,LOCALAPPDATA:INFO.local};
  const c=k.data.map(t=>fill(t,v).replace(/\\/g,INFO.sep)), ok=(await api('exists',{paths:c})).r;
  return c.find((p,i)=>ok[i])||'';
}

    if(a==='rewiz'){S.setup=false;return wizard(0)}
  };

/* first-run walkthrough: three steps, nothing gets moved */
async function wizard(step){
  if(INFO.android&&!INFO.storage){
    modal('Let Cove see your games','<p>Cove needs permission to read the folders your games are in. Android asks for this once: on the next screen, switch on <b>Allow access to manage all files</b> for Cove, then come back.</p>','<button class="btn" data-act="again">I have allowed it</button><button class="btn pri xl" data-act="perm">Open the setting</button>');
    onChange=()=>{};onAct=async a=>{if(a==='perm')return api('perm');INFO=await api('info');wizard(step)};return;
  }
  if(!S.library){S.library=J(INFO.app,'Library');await api('mkdir',{paths:['ROMs','Inbox','Art','Backups'].map(d=>J(S.library,d))});save()}
  const n=`<small>Step ${step+1} of 3</small>`, by={};
  GAMES.forEach(g=>by[g.sys]=(by[g.sys]||0)+1);
  if(step===0)modal('Where are your emulators?',`${n}<p>Choose the folder that holds them. Cove looks through it and recognises about 20 emulators, plus Switch forks it has never heard of.</p>
      <div class="row"><button class="btn pri" data-act="scanemu">Choose a folder</button></div>
      ${S.emus.map(e=>`<div class="row"><b>${esc(e.name)}</b><small>${esc(emuSys(e).map(s=>sysOf(s)?.label||s).join(', '))}</small></div>`).join('')||'<small>Nothing found yet. You can also add them later in Settings.</small>'}`,
      `<button class="btn ${S.emus.length?'pri':''}" data-act="next">${S.emus.length?'Continue':'Skip for now'}</button>`);
  if(step===1)modal('Where are your games?',`${n}<p>Choose the folder they are in. Cove reads them in place, in whatever layout you already have, and works out the system for each one. Nothing is moved or renamed.</p>
      <div class="row"><button class="btn pri" data-act="addroot">Choose a folder</button></div>
      ${S.roots.map(r=>`<div class="row"><code>${esc(r)}</code></div>`).join('')}
      ${GAMES.length?`<p><b>${GAMES.length} games found:</b> ${esc(Object.keys(by).map(k=>sysOf(k).name+' ('+by[k]+')').join(', '))}</p>`:S.roots.length?'<small>No games recognised in there yet.</small>':''}`,
      `<button class="btn ${GAMES.length?'pri':''}" data-act="next">${GAMES.length?'Continue':'Skip for now'}</button>`);
  if(step===2)modal('Ready',`${n}<p>Arrow keys or a controller move around. Enter or A launches. Right-click or Y opens a game's options: its system, emulator, artwork, hide and delete.</p>
      <div class="row"><button class="btn" data-act="applnk">Add Cove to the desktop</button><button class="btn" data-act="saves">Import saves from another emulator</button></div>`,
      `<button class="btn pri" data-act="done">Start playing</button>`);
  onChange=()=>{};
  onAct=async a=>{
    if(a==='next')return wizard(step+1);
    if(a==='scanemu'){const p=INFO.android?'apps':await pick('folder');if(p){toast('Found '+await findEmus(p)+' emulator(s)');wizard(0)}return}
    if(a==='addroot'){const p=await pick('folder');if(p){addRoot(p);await scan();wizard(1)}return}
    if(a==='saves'){S.setup=true;save();await scan();render();return settings('saves')}
    if(a==='applnk'){await api('shortcut',{name:'Cove'});return toast('Cove is on your desktop')}
    if(a==='done'){S.setup=true;save();await scan();closeModal()}
  };
}

/* ---------- updates: compares this copy's version.json with the one in its GitHub repo ---------- */
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function checkUpdate(manual){
  if(!INFO.repo||!INFO.version)return manual&&toast('This copy has no update address');
  let v; try{const r=await fetch(`https://raw.githubusercontent.com/${INFO.repo}/main/version.json?`+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;v=await r.json()}catch{return manual&&toast('Could not reach the update address')}
  if(!newer(v.version,INFO.version))return manual&&toast('You have the latest version ('+INFO.version+')');
  if(!manual&&(S.skipVer===v.version||$('#layer').children.length))return;
  modal('Update available',`<p><b>Cove ${esc(v.version)}</b> is ready. You have ${esc(INFO.version)}.</p>${v.notes?`<div class="card">${esc(v.notes)}</div>`:''}
    <p class="dim">Your games, settings and saves are not touched. The version you have now is kept in Cove's data folder in case you want it back.</p>`,
    `<button class="btn" data-act="skip">Skip this version</button><button class="btn" data-act="later">Later</button><button class="btn pri xl" data-act="install">Install</button>`);
  onChange=()=>{};
  onAct=async a=>{
    if(a==='skip'){S.skipVer=v.version;save()}
    if(a!=='install')return closeModal();
    modal('Updating',`<p>Installing Cove ${esc(v.version)}. This takes a few seconds and Cove will reload itself.</p>`,'');
    await api('update');
    for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,700));try{if((await fetch('/',{cache:'no-store'})).ok)return location.reload()}catch{}}
    modal('Almost done','<p>The update is installed. Close Cove and open it again.</p>','<button class="btn pri" data-act="x">OK</button>');onAct=()=>closeModal();
  };
}

/* ---------- boot ---------- */
(async()=>{
  INFO=await api('info');
  if(INFO.android){KINDS.length=0;KINDS.push(...AKINDS.map(k=>({...k,rx:/^$/,args:''})),{id:'custom',name:'Custom',rx:/^$/,args:'',sys:[]})}
  const raw=await api('state');
  S={...structuredClone(DEF),...raw,ui:{...DEF.ui,...raw.ui},discord:{...DEF.discord,...raw.discord},scrape:{...structuredClone(DEF.scrape),...raw.scrape}};
  if(!S.scrape.order.includes('steam'))S.scrape.order.splice(Math.max(0,S.scrape.order.indexOf('wiki')),0,'steam');
  if(S.artV!==2){S.artV=2;for(const k in S.art)if(!S.art[k])delete S.art[k]}   // retry covers recorded as missing by older versions
  if(S.ui.v2!==2){S.ui.v2=2;S.ui.view='shelf'}   // one-time switch to the current default layout
  if(!LAYOUTS.some(l=>l[0]===S.ui.view))S.ui.view='shelf';
  if(!S.users?.length){S.users=[{id:'p1',name:'Player 1',col:'#19d3c5'}];S.user='p1'}
  userUI();
  setTimeout(()=>$('#splash').classList.add('gone'),900);
  look();
  if((INFO.v||1)<VER)setTimeout(()=>toast('Update ready: close Cove, wait 10 seconds, then reopen it'),1500);
  if(!S.setup)return wizard(0);
  await scan();render();
  if(INFO.version){$('#ver').textContent='v'+INFO.version;$('#ver').onclick=()=>settings('about')}
  setTimeout(()=>checkUpdate(false),2500);
  syncPresence();
  if(!INFO.android&&!S.esde&&S.esde!==''&&INFO.docs){const g=J(dir(INFO.docs),'ES-DE');try{if((await api('exists',{paths:[J(g,'downloaded_media')]})).r[0]){S.esde=g;save();await scan();render(true)}}catch{}}
})().catch(e=>{$('#splash')?.remove();document.body.innerHTML='<p style="padding:40px">Cove could not start: '+esc(e.message)+'</p>'});
</script>
</body>
</html>
